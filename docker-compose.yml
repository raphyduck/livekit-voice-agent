services:
  voice-agent:
    # 1536m depuis l origine ; la noise cancellation BVC charge son modele dans
    # CHAQUE process de job preteint, ce qui faisait tuer les workers par l OOM
    # killer (exit -9) et rendait l agent muet apres le decroche (29/08/2026).
    mem_limit: 4g
    memswap_limit: 4g
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - /home/raph/hobbitton-memory:/brain:ro
      - ./data:/data
      - ./google_credentials.json:/app/google_credentials.json:ro
      - ./google_token.json:/app/google_token.json
    network_mode: host
